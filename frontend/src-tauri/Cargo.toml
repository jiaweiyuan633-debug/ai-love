[package]
name = "ai-love"
version = "1.0.0"
description = "AI 恋爱大师 —— 懂你的恋爱顾问与情感陪伴"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_love_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
