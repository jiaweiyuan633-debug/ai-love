name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试 (Spring Boot + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_love
          POSTGRES_PASSWORD: ai_love123
          POSTGRES_DB: ai_love_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ai_love"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 启用 pgvector 扩展（schema.sql 假定扩展已建）
        run: |
          docker exec $(docker ps -q --filter ancestor=pgvector/pgvector:pg16) \
            psql -U ai_love -d ai_love_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: 运行测试（集成 + 单元）
        working-directory: backend
        run: mvn -B test

  frontend:
    name: 前端测试与构建 (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 组件测试（Vitest）
        working-directory: frontend
        run: npm test
      - name: 类型检查与构建
        working-directory: frontend
        run: npm run build

  mcp-server:
    name: MCP 服务编译 (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 编译与测试
        working-directory: mcp-server
        run: mvn -B test
