spring:
  application:
    name: ai-love-backend
  # 启动时执行 schema.sql（幂等建表：用户/会话/消息/长期记忆）。云端无数据库部署会跳过
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
  # 云端无数据库部署时，通过环境变量排除 JDBC/pgvector 自动配置：
  # SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  autoconfigure:
    exclude: ${SPRING_AUTOCONFIGURE_EXCLUDE:}
  datasource:
    # 15432 = docker/docker-compose.yml 中 pgvector 的宿主机端口（避让本机原生 PostgreSQL 的 5432）
    # 生产/RDS 通过 SPRING_DATASOURCE_URL/USERNAME/PASSWORD 环境变量覆盖
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:15432/ai_love}
    username: ${SPRING_DATASOURCE_USERNAME:ai_love}
    password: ${SPRING_DATASOURCE_PASSWORD:ai_love123}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    openai:
      # 复用 Spring AI 官方 OpenAI 客户端，走通义千问 OpenAI 兼容模式
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        dimensions: 1024
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      client:
        # MCP 服务未启动时可置 false 单独跑主应用
        enabled: ${MCP_CLIENT_ENABLED:true}
        toolcallback:
          enabled: true
        sse:
          connections:
            ai-love-mcp:
              # 云上部署时用环境变量覆盖为 MCP 服务的公网/内网地址
              url: ${MCP_SSE_URL:http://127.0.0.1:8102}

server:
  port: 8101

# Redis 连接（限流后端切换 RATE_LIMIT_BACKEND=redis 时启用；默认 memory 不建立连接）
# 生产/RDS 示例：SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT / SPRING_DATA_REDIS_PASSWORD
# spring:
#   data:
#     redis:
#       host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
#       port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 不向前端暴露组件细节（数据库地址等），只返回 UP/DOWN
      show-details: never
  health:
    # 引入 data-redis 后健康检查会探测 Redis；默认 memory 限流下无实例，显式关闭避免 /health 变 DOWN
    redis:
      enabled: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}

app:
  # 持久化/用户系统总开关（需要数据库）。云端无数据库时置 false：关闭登录与会话持久化，进入体验模式
  persistence:
    enabled: ${PERSISTENCE_ENABLED:true}
  # 接口限流：登录/注册按 IP 每分钟 10 次（防爆破）；AI 消耗端点按用户每分钟 30 次（防刷）
  # backend=memory 进程内计数（默认）；backend=redis 多实例共享（需 Redis 实例，故障时自动放行）
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    backend: ${RATE_LIMIT_BACKEND:memory}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    ai-per-minute: ${RATE_LIMIT_AI_PER_MINUTE:30}
  # 知识库/RAG 功能开关（无数据库的云端部署置 false）
  knowledge:
    enabled: ${KNOWLEDGE_ENABLED:true}
  # 云端内联恋爱工具（与 MCP 远程工具二选一：云端 true + MCP 关闭；本地默认走 MCP）
  inline-love-tools:
    enabled: ${INLINE_LOVE_TOOLS:false}
  jwt:
    # 生产环境务必通过环境变量覆盖（HS256 密钥，至少 32 字节）
    secret: ${JWT_SECRET:ai-love-dev-secret-change-me-in-production-0123456789}
    expire-hours: ${JWT_EXPIRE_HOURS:168}
