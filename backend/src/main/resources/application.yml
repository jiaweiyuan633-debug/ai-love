spring:
  application:
    name: ai-love-backend
  # 启动时执行 schema.sql（幂等建表：用户/会话/消息/长期记忆）。云端无数据库部署会跳过
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
  # 云端无数据库部署时，通过环境变量排除 JDBC/pgvector 自动配置：
  # SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  autoconfigure:
    exclude: ${SPRING_AUTOCONFIGURE_EXCLUDE:}
  datasource:
    # 15432 = docker/docker-compose.yml 中 pgvector 的宿主机端口（避让本机原生 PostgreSQL 的 5432）
    url: jdbc:postgresql://127.0.0.1:15432/ai_love
    username: ai_love
    password: ai_love123
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    openai:
      # 复用 Spring AI 官方 OpenAI 客户端，走通义千问 OpenAI 兼容模式
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        dimensions: 1024
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      client:
        # MCP 服务未启动时可置 false 单独跑主应用
        enabled: ${MCP_CLIENT_ENABLED:true}
        toolcallback:
          enabled: true
        sse:
          connections:
            ai-love-mcp:
              # 云上部署时用环境变量覆盖为 MCP 服务的公网/内网地址
              url: ${MCP_SSE_URL:http://127.0.0.1:8102}

server:
  port: 8101

app:
  # 持久化/用户系统总开关（需要数据库）。云端无数据库时置 false：关闭登录与会话持久化，进入体验模式
  persistence:
    enabled: ${PERSISTENCE_ENABLED:true}
  # 知识库/RAG 功能开关（无数据库的云端部署置 false）
  knowledge:
    enabled: ${KNOWLEDGE_ENABLED:true}
  # 云端内联恋爱工具（与 MCP 远程工具二选一：云端 true + MCP 关闭；本地默认走 MCP）
  inline-love-tools:
    enabled: ${INLINE_LOVE_TOOLS:false}
  jwt:
    # 生产环境务必通过环境变量覆盖（HS256 密钥，至少 32 字节）
    secret: ${JWT_SECRET:ai-love-dev-secret-change-me-in-production-0123456789}
    expire-hours: ${JWT_EXPIRE_HOURS:168}
