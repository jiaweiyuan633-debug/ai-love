spring:
  application:
    name: ai-love-backend
  datasource:
    # 15432 = docker/docker-compose.yml 中 pgvector 的宿主机端口（避让本机原生 PostgreSQL 的 5432）
    url: jdbc:postgresql://127.0.0.1:15432/ai_love
    username: ai_love
    password: ai_love123
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    openai:
      # 复用 Spring AI 官方 OpenAI 客户端，走通义千问 OpenAI 兼容模式
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        dimensions: 1024
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      client:
        # MCP 服务未启动时可置 false 单独跑主应用
        enabled: ${MCP_CLIENT_ENABLED:true}
        toolcallback:
          enabled: true
        sse:
          connections:
            ai-love-mcp:
              url: http://127.0.0.1:8102

server:
  port: 8101
